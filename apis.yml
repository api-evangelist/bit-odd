aid: bit-odd
name: BIT ODD
description: 'BIT ODD is a Helsinki-based mobile game studio founded in 2019 by former
  Supercell creative leads Lasse Louhento, Taneli Oksama, and Jani Lintunen. The studio
  hand-crafts casual mobile games driven by feeling and a sense of wonder rather than
  aggressive monetization, explicitly rejecting ad-spam and dark-pattern design. Backed
  by Index Ventures, Griffin Gaming Partners, and Makers Fund across a EUR 5M seed and
  a EUR 17M round, BIT ODD is a consumer entertainment company with no public developer
  platform, API, or SDK surface; this API Evangelist profile tracks the company as a
  portfolio lead and carries only the artifacts that can be honestly probed from its
  public web presence (domain security, legal pages).'
